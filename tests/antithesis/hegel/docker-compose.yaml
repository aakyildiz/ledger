# Antithesis deployment for the hegel driver: a 3-node ledger cluster, MinIO
# (backups) and NATS (event sinks), three client containers running the
# ledger's Go gRPC client, and the driver. Build context: repository root.
x-ledger: &ledger
  platform: linux/amd64
  build:
    context: ../../..
    dockerfile: tests/antithesis/hegel/ledger/Dockerfile
  image: ledger-hegel:latest
  restart: on-failure
  init: true
  environment: &ledger-env
    WAL_DIR: /data/raft
    DATA_DIR: /data/app
    CLUSTER_ID: default
    INSECURE: "true"
    DEBUG: "true"
    JSON_FORMATTING_LOGGER: "true"
    SNAPSHOT_THRESHOLD: "200"
    CACHE_ROTATION_THRESHOLD: "50"
    SPOOL_SEGMENT_MAX_BYTES: "262144"
    BLOOM_VOLUMES_EXPECTED_KEYS: "1000000"
    BLOOM_METADATA_EXPECTED_KEYS: "1000000"
    BLOOM_REFERENCES_EXPECTED_KEYS: "1000000"
    SENTINEL_MODE: "true"
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    LOG_FORWARD_ADDR: driver:7777

x-client: &client
  platform: linux/amd64
  build:
    context: ../../..
    dockerfile: tests/antithesis/hegel/client/Dockerfile
  image: ledger-hegel-client:latest
  restart: on-failure
  init: true
  environment:
    LEDGER_GRPC_ADDR: ledger-0:8888,ledger-1:8888,ledger-2:8888
    LOG_FORWARD_ADDR: driver:7777
    OUTCOME_ADDR: driver:7778

services:
  ledger-0:
    <<: *ledger
    container_name: ledger-0
    hostname: ledger-0
    environment: { <<: *ledger-env, NODE_ID: "1" }
    volumes: [ledger-0-wal:/data/raft, ledger-0-data:/data/app]
  ledger-1:
    <<: *ledger
    container_name: ledger-1
    hostname: ledger-1
    environment: { <<: *ledger-env, NODE_ID: "2" }
    volumes: [ledger-1-wal:/data/raft, ledger-1-data:/data/app]
  ledger-2:
    <<: *ledger
    container_name: ledger-2
    hostname: ledger-2
    environment: { <<: *ledger-env, NODE_ID: "3" }
    volumes: [ledger-2-wal:/data/raft, ledger-2-data:/data/app]

  minio:
    platform: linux/amd64
    image: ghcr.io/formancehq/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    container_name: minio
    hostname: minio
    restart: on-failure
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [minio-data:/data]
  minio-init:
    platform: linux/amd64
    image: ghcr.io/formancehq/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    container_name: minio-init
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        until mc mb --ignore-existing local/backups; do sleep 1; done
  nats:
    platform: linux/amd64
    image: nats:2.10.22-alpine
    container_name: nats
    hostname: nats
    restart: on-failure
    command: ["-js"]

  client1: { <<: *client, container_name: client1, hostname: client1 }
  client2: { <<: *client, container_name: client2, hostname: client2 }
  client3: { <<: *client, container_name: client3, hostname: client3 }

  driver:
    platform: linux/amd64
    build:
      context: ../../..
      dockerfile: tests/antithesis/hegel/driver/Dockerfile
    image: ledger-hegel-driver:latest
    container_name: driver
    hostname: driver
    init: true
    environment:
      LEDGER_NODES: ledger-0:8888,ledger-1:8888,ledger-2:8888
      CLIENT_URLS: http://client1:8080,http://client2:8080,http://client3:8080
      MINIO_URL: http://minio:9000
      RUST_BACKTRACE: "1"

volumes:
  ledger-0-wal:
  ledger-0-data:
  ledger-1-wal:
  ledger-1-data:
  ledger-2-wal:
  ledger-2-data:
  minio-data:
