# Antithesis deployment for the hegel driver: a 3-node ledger cluster, MinIO
# (backups) and NATS (event sinks), three client containers running the
# ledger's Go gRPC client, the oracle service, and the driver. Build context:
# repository root.

# The query-checkpoint limit is replicated cluster policy; the oracle models
# the same value and the driver sends it in /setup (DESIGN §8).
x-qcl: &qcl "10"

x-ledger: &ledger
  platform: linux/amd64
  build:
    context: ../../..
    dockerfile: tests/antithesis/hegel/ledger/Dockerfile
  image: ledger-hegel:latest
  restart: on-failure
  init: true
  environment: &ledger-env
    WAL_DIR: /data/raft
    DATA_DIR: /data/app
    CLUSTER_ID: default
    INSECURE: "true"
    # DEBUG is not bound by the server (go-libs skips it); LOG_LEVEL is the
    # knob that surfaces Debugf lines (server-signals spool/sync messages).
    LOG_LEVEL: debug
    JSON_FORMATTING_LOGGER: "true"
    # Followers more than 100 entries behind get a snapshot: sync-with-leader
    # gated windows and spool replay (SNAPSHOT_THRESHOLD was a dead knob).
    RAFT_COMPACTION_MARGIN: "100"
    MAINTENANCE_INTERVAL: 5s
    # Small segments rotate and seal often (spool pruning after resync).
    SPOOL_SEGMENT_MAX_BYTES: "4096"
    RAFT_REPLAY_BATCH_SIZE: "32"
    SNAPSHOT_PARALLELISM: "1"
    PEBBLE_MAX_CHECKPOINTS: "3"
    # Never expire idempotency entries: the oracle never evicts them, and
    # clock jitter would otherwise break replay determinism.
    IDEMPOTENCY_TTL: 0s
    QUERY_CHECKPOINT_LIMIT: *qcl
    # BLOOM_VOLUMES_EXPECTED_KEYS differs per node (services below): a
    # leadership change then rebuilds the bloom filter. CACHE_ROTATION_THRESHOLD
    # is the SAME on every node for now (DESIGN §8 wants 50/64/80): with
    # different thresholds, the two nodes that join the bootstrap node never
    # apply ledger-scoped entries (GetLog sequence 3 is createLedger on node 1
    # and missing on nodes 2 and 3 right after setup; every tracked read on a
    # follower answers "ledger not found"). Node-local configuration must not
    # change how a committed entry is applied (CLAUDE.md invariant 2): a server
    # finding reported by task 99. Restore 50/64/80 once it is fixed.
    CACHE_ROTATION_THRESHOLD: "50"
    BLOOM_METADATA_EXPECTED_KEYS: "1000000"
    BLOOM_REFERENCES_EXPECTED_KEYS: "1000000"
    SENTINEL_MODE: "true"
    # The Antithesis VM's disk is ~5 GiB. Pebble preallocates each WAL file to
    # the memtable size (256Mi by default), which filled it within minutes and
    # tripped the "disk usage exceeds threshold" assertion. Smaller memtables
    # also flush and compact more often.
    PEBBLE_MEMTABLE_SIZE: 32Mi
    READ_INDEX_MEMTABLE_SIZE: 16Mi
    # Three nodes share one VM; the 1Gi default block cache each is too much.
    PEBBLE_CACHE_SIZE: 128Mi
    AWS_ACCESS_KEY_ID: minioadmin
    AWS_SECRET_ACCESS_KEY: minioadmin
    LOG_FORWARD_ADDR: driver:7777

x-client: &client
  platform: linux/amd64
  build:
    context: ../../..
    dockerfile: tests/antithesis/hegel/client/Dockerfile
  image: ledger-hegel-client:latest
  restart: on-failure
  init: true
  environment:
    LEDGER_GRPC_ADDR: ledger-0:8888,ledger-1:8888,ledger-2:8888
    LOG_FORWARD_ADDR: driver:7777
    OUTCOME_ADDR: driver:7778

services:
  ledger-0:
    <<: *ledger
    container_name: ledger-0
    hostname: ledger-0
    environment: { <<: *ledger-env, NODE_ID: "1", BLOOM_VOLUMES_EXPECTED_KEYS: "1000000" }
    volumes: [ledger-0-wal:/data/raft, ledger-0-data:/data/app]
  ledger-1:
    <<: *ledger
    container_name: ledger-1
    hostname: ledger-1
    environment: { <<: *ledger-env, NODE_ID: "2", BLOOM_VOLUMES_EXPECTED_KEYS: "1000001" }
    volumes: [ledger-1-wal:/data/raft, ledger-1-data:/data/app]
  ledger-2:
    <<: *ledger
    container_name: ledger-2
    hostname: ledger-2
    environment: { <<: *ledger-env, NODE_ID: "3", BLOOM_VOLUMES_EXPECTED_KEYS: "1000002" }
    volumes: [ledger-2-wal:/data/raft, ledger-2-data:/data/app]

  minio:
    platform: linux/amd64
    image: ghcr.io/formancehq/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    container_name: minio
    hostname: minio
    restart: on-failure
    # minio exits 2, silently, on SIGTERM/SIGINT during its first ~0.3 s,
    # before its signal handler is installed, when it is PID 1 (the image
    # entrypoint only runs `exec "$@"`). Seen when a stop fault lands right
    # after a kill-fault restart. Run it under sh and report a signalled
    # shutdown as clean so Antithesis stop faults don't count as unexpected
    # exits. Not PID 1, an early signal kills it (143); later it exits 0.
    # The remap is keyed on a flag the trap sets, so it applies only when the
    # wrapper itself caught the signal. The second wait collects minio's
    # status when the trap interrupted the first; it answers 127 when the
    # first wait had already reaped minio, and the first status is kept.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        minio server /data --console-address ":9001" & pid=$$!
        sig=0
        trap 'sig=1; kill -TERM $$pid 2>/dev/null' TERM INT
        wait $$pid; status=$$?
        if [ $$sig -eq 1 ]; then
          wait $$pid; s2=$$?; [ $$s2 -ne 127 ] && status=$$s2
          case $$status in 0|2|143) status=0;; esac
        fi
        exit $$status
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [minio-data:/data]
  minio-init:
    platform: linux/amd64
    image: ghcr.io/formancehq/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    container_name: minio-init
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        until mc mb --ignore-existing local/backups; do sleep 1; done
  nats:
    platform: linux/amd64
    image: nats:2.10.22-alpine
    container_name: nats
    hostname: nats
    restart: on-failure
    # nats-server exits 1 on SIGTERM; report a signalled shutdown as clean so
    # Antithesis's stop faults don't count as unexpected exits. The remap is
    # keyed on a flag the trap sets, not on the exit status: a nats-server
    # killed by a signal the wrapper never received (the OOM killer) keeps its
    # own status (137) instead of a second wait's 127. An early signal, before
    # nats-server installs its handler, kills it (143), also remapped.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        nats-server -js & pid=$$!
        sig=0
        trap 'sig=1; kill -TERM $$pid 2>/dev/null' TERM INT
        wait $$pid; status=$$?
        if [ $$sig -eq 1 ]; then
          wait $$pid; s2=$$?; [ $$s2 -ne 127 ] && status=$$s2
          case $$status in 0|1|143) status=0;; esac
        fi
        exit $$status

  client1: { <<: *client, container_name: client1, hostname: client1 }
  client2: { <<: *client, container_name: client2, hostname: client2 }
  client3: { <<: *client, container_name: client3, hostname: client3 }

  # The oracle service: passive and deterministic, no cluster access. Excluded
  # from faults with the driver. Its stdout is captured by Antithesis
  # directly; the driver parses nothing from it, so no forward-logs.
  oracle:
    platform: linux/amd64
    build:
      context: ../../..
      dockerfile: tests/antithesis/hegel/oracle/Dockerfile
    image: ledger-hegel-oracle:latest
    container_name: oracle
    hostname: oracle
    init: true
    restart: on-failure
    entrypoint: ["/usr/local/bin/oracle"]
    environment:
      ORACLE_ADDR: ":8090"
      QUERY_CHECKPOINT_LIMIT: *qcl

  driver:
    platform: linux/amd64
    build:
      context: ../../..
      dockerfile: tests/antithesis/hegel/driver/Dockerfile
    image: ledger-hegel-driver:latest
    container_name: driver
    hostname: driver
    init: true
    environment:
      LEDGER_NODES: ledger-0:8888,ledger-1:8888,ledger-2:8888
      CLIENT_URLS: http://client1:8080,http://client2:8080,http://client3:8080
      MINIO_URL: http://minio:9000
      ORACLE_URL: http://oracle:8090
      QUERY_CHECKPOINT_LIMIT: *qcl
      # Task 09's `checkpoints` view exists: task 07's inspect_index may read
      # an index from a query checkpoint.
      HEGEL_HAVE_CHECKPOINTS: "1"
      # The driver starts threads all the time (hegel workers per test case,
      # scoped dispatch threads); with glibc's default of 8 arenas per CPU the
      # freed memory stayed spread over many arenas and the RSS grew to 800 MB
      # in 20 minutes (task 99). Two arenas keep it near 50 MB.
      MALLOC_ARENA_MAX: "2"
      RUST_BACKTRACE: "1"

  # ==== 18-restore (services appended by tasks/18) ====
  # Restore targets (task 18, restore.md §4.2): restore-agent supervises one
  # ledger-server child that the driver starts in restore, normal or join
  # mode, with its own cluster id (restore-g<gen>, never `default`). The
  # child's environment is built by the agent from an allowlist, so
  # CLUSTER_ID from x-ledger never reaches it. `nats` resolves to localhost:
  # a restored cluster keeps the source's event sinks and must never deliver
  # into the source's subjects (DESIGN §2.3). restore-1 (the joiner) idles
  # unless the driver runs with RESTORE_JOINER=1.
  restore-0:
    <<: &restore
      platform: linux/amd64
      build:
        context: ../../..
        dockerfile: tests/antithesis/hegel/restore/Dockerfile
      image: ledger-hegel-restore:latest
      restart: on-failure
      init: true
      extra_hosts: ["nats:127.0.0.1"]
      environment: &restore-env
        <<: *ledger-env
        WAL_DIR: /data/raft
        DATA_DIR: /data/app
        AGENT_ADDR: ":8090"
        AGENT_STATE: /data/agent.json
        S3_BUCKET: backups
        S3_ENDPOINT: http://minio:9000
        S3_REGION: us-east-1
        # One restored copy plus one staged download at a time; small caches
        # (DESIGN §2.4: 700 MB RSS, 500 MB volume).
        PEBBLE_CACHE_SIZE: 32Mi
        PEBBLE_MEMTABLE_SIZE: 16Mi
        READ_INDEX_MEMTABLE_SIZE: 8Mi
    container_name: restore-0
    hostname: restore-0
    volumes: [restore-0:/data]
  restore-1:
    <<: *restore
    container_name: restore-1
    hostname: restore-1
    volumes: [restore-1:/data]
  # ==== end 18-restore ====

volumes:
  ledger-0-wal:
  ledger-0-data:
  ledger-1-wal:
  ledger-1-data:
  ledger-2-wal:
  ledger-2-data:
  minio-data:
  # ==== 18-restore (services appended by tasks/18) ====
  restore-0:
  restore-1:
  # ==== end 18-restore ====
